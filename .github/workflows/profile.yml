name: Refresh profile

on:
  schedule:
    - cron: "30 14 * * *"   # daily, an hour after the blog's editorial run
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Latest blog posts
        run: python scripts/update_posts.py

      - name: Commit README if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update latest writing"
          git push

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#c8ff57&color_dots=#161616,#2b3a12,#557a1c,#8fbf2f,#c8ff57&color_background=#0e0e0e
            dist/snake-light.svg?color_snake=#4a7a00&color_dots=#ebedf0,#d9f0a8,#b5e061,#86b82a,#4a7a00

      - name: Publish snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
