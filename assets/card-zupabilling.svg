<text class="d" x="28" y="78"><tspan x="28" dy="0">Checks a seller with live Google evidence and signs the exact cart</tspan><tspan x="28" dy="21">before an AI agent can pay. Paytm × Etriq AI Hackathon Finals.</tspan></text>
