<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="Travel Refund Assurance">
<style>
 .t{font:700 22px Syne, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#f0ede8}
 .d{font:400 14.5px 'DM Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#b0aba4}
 .chip{font:400 12px 'DM Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;fill:#888888}
 .b{font:500 12px 'DM Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;fill:#0e0e0e;letter-spacing:1px}
 .edge{animation:e 10s ease-in-out infinite}
 @keyframes e{0%,80%,100%{opacity:0}88%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.edge{animation:none}}
</style>
<rect x=".5" y=".5" width="599" height="189" rx="14" fill="#141414" stroke="#232323"/>
<rect class="edge" x=".5" y=".5" width="599" height="189" rx="14" fill="none" stroke="#c8ff57" stroke-opacity=".55"/>
<text class="t" x="28" y="44">Travel Refund Assurance</text>
<rect x="506" y="26" width="66" height="22" rx="11" fill="#c8ff57"/>
<text class="b" x="539.0" y="41" text-anchor="middle">CODE ↗</text>
<text class="d" x="28" y="78"><tspan x="28" dy="0">Reconstructs the airline refund a passenger was owed under the fare</tspan><tspan x="28" dy="21">rules in force, with evidence behind every rupee. No LLM in the math.</tspan></text>
<rect x="28" y="152" width="62" height="22" rx="11" fill="none" stroke="#232323"/><text class="chip" x="59" y="167" text-anchor="middle">Python</text><rect x="97.6" y="152" width="69" height="22" rx="11" fill="none" stroke="#232323"/><text class="chip" x="132" y="167" text-anchor="middle">FastAPI</text><rect x="174.79999999999998" y="152" width="115" height="22" rx="11" fill="none" stroke="#232323"/><text class="chip" x="232" y="167" text-anchor="middle">Deterministic</text>
</svg>